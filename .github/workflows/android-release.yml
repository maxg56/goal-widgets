# Chaque push sur main touchant l'app Android : tests, APK release signé, GitHub Release
# `build-<versionCode>` marquée « latest ». L'app (update.AppUpdater) la détecte quand elle est
# ouverte, la télécharge et l'installe.
#
# Secrets attendus (Settings → Secrets and variables → Actions) :
#   SIGNING_KEYSTORE_BASE64  keystore encodé en base64 (clé de debug de l'appareil, cf. ENV.md)
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
name: Android release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "shared-cases/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Deux pushs rapprochés : les releases sont créées dans l'ordre, sans s'annuler.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - name: Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 absent : APK non signé, release annulée."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Tests et APK release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew test assembleRelease
          -PversionCode=${{ steps.version.outputs.code }}
          "-PversionName=${{ steps.version.outputs.name }}"

      - name: APK
        id: apk
        run: |
          apk="$RUNNER_TEMP/goal-widgets-${{ steps.version.outputs.code }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        run: |
          git log -1 --format=%B > "$RUNNER_TEMP/notes.md"
          gh release create "build-${{ steps.version.outputs.code }}" "${{ steps.apk.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "Goal Widgets ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      # Garde les 10 dernières releases build-* (et supprime leurs tags).
      - name: Nettoyage des anciennes releases
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | { grep -E '^build-[0-9]+$' || true; } \
            | sort -t- -k2 -n -r \
            | tail -n +11 \
            | while read -r tag; do
                gh release delete "$tag" --yes --cleanup-tag
              done

      - name: Suppression du keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
