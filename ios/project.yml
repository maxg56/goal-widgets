# Non vérifié : écrit sans Xcode (machine Linux).
# Projet Xcode généré par XcodeGen : `brew install xcodegen && cd ios && xcodegen`
# Le .xcodeproj généré n'est pas versionné ; ce fichier fait foi.
name: GoalWidgets
options:
  bundleIdPrefix: app.goalwidgets
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
packages:
  GoalCore:
    path: GoalCore
targets:
  GoalWidgets:
    type: application
    platform: iOS
    sources:
      - GoalWidgets
    dependencies:
      - package: GoalCore
      # Extension widget (t07), intégrée à l'app (embed par défaut pour une app-extension).
      - target: GoalWidgetsWidget
    # Info.plist généré par XcodeGen (non versionné), fusionné avec GENERATE_INFOPLIST_FILE :
    # seul ajout = schéma d'URL `goalwidgets://` pour les liens profonds des widgets (t07).
    info:
      path: Config/GoalWidgets-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.goalwidgets
            CFBundleURLSchemes:
              - goalwidgets
    # App Group partagé avec l'extension widget (t07) : stockage SwiftData commun.
    entitlements:
      path: GoalWidgets/GoalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goalwidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goalwidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goal Widgets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"

  # Extension widget (t07) : WidgetKit + AppIntent de configuration.
  # Partage avec l'app : stockage SwiftData (Storage/), libellés (GoalLabels) et chaînes (fr.lproj).
  GoalWidgetsWidget:
    type: app-extension
    platform: iOS
    sources:
      - GoalWidgetsWidget
      - path: GoalWidgets/Storage
      - path: GoalWidgets/GoalLabels.swift
      - path: GoalWidgets/fr.lproj
    dependencies:
      - package: GoalCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: GoalWidgetsWidget/GoalWidgetsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goalwidgets
    info:
      path: Config/GoalWidgetsWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goalwidgets.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goal Widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
