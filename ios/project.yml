# Non vérifié : écrit sans Xcode (machine Linux).
# Projet Xcode généré par XcodeGen : `brew install xcodegen && cd ios && xcodegen`
# Le .xcodeproj généré n'est pas versionné ; ce fichier fait foi.
name: GoalWidgets
options:
  bundleIdPrefix: app.goalwidgets
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
packages:
  GoalCore:
    path: GoalCore
targets:
  GoalWidgets:
    type: application
    platform: iOS
    sources:
      - GoalWidgets
    dependencies:
      - package: GoalCore
      # Extension widget (t07), intégrée à l'app (embed par défaut pour une app-extension).
      - target: GoalWidgetsWidget
    # Info.plist généré par XcodeGen (non versionné), fusionné avec GENERATE_INFOPLIST_FILE :
    # ajouts = schéma d'URL `goalwidgets://` pour les liens profonds des widgets et notifications (t07),
    # tâche de fond de reprogrammation des notifications (t09, BGAppRefreshTask → mode `fetch`).
    info:
      path: Config/GoalWidgets-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.goalwidgets
            CFBundleURLSchemes:
              - goalwidgets
        BGTaskSchedulerPermittedIdentifiers:
          - app.goalwidgets.reschedule-notifications
        UIBackgroundModes:
          - fetch
        # Partage d'un objectif (t13) : fichier `<titre>.goalwidgets.json` (export v1 d'un objectif).
        # Type exporté `app.goalwidgets.goal` (conforme à public.json, extension `goalwidgets`) ; l'app
        # s'annonce aussi pour public.json car le nom se termine par `.json` (l'extension vue par le
        # système) et les messageries transmettent souvent le fichier comme JSON simple.
        # Copie dans Documents/Inbox (pas d'ouverture sur place) → lue dans `onOpenURL`.
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.goalwidgets.goal
            UTTypeDescription: Objectif Goal Widgets
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - goalwidgets
        CFBundleDocumentTypes:
          - CFBundleTypeName: Objectif Goal Widgets
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.goalwidgets.goal
          - CFBundleTypeName: JSON
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
    # App Group partagé avec l'extension widget (t07) : stockage SwiftData commun.
    entitlements:
      path: GoalWidgets/GoalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goalwidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goalwidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goal Widgets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"

  # Extension widget (t07) : WidgetKit + AppIntent de configuration.
  # Partage avec l'app : stockage SwiftData (Storage/), libellés (GoalLabels), teintes (GoalAppearance),
  # dessin des graphiques (Charts/) et chaînes (fr.lproj).
  GoalWidgetsWidget:
    type: app-extension
    platform: iOS
    sources:
      - GoalWidgetsWidget
      - path: GoalWidgets/Storage
      - path: GoalWidgets/GoalLabels.swift
      # Teintes clair/sombre des couleurs d'objectif (t11).
      - path: GoalWidgets/GoalAppearance.swift
      # Dessin des graphiques (modern-ui), commun au détail de l'app et au widget à graphique.
      - path: GoalWidgets/Charts
      - path: GoalWidgets/fr.lproj
    dependencies:
      - package: GoalCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: GoalWidgetsWidget/GoalWidgetsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goalwidgets
    info:
      path: Config/GoalWidgetsWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goalwidgets.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goal Widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
