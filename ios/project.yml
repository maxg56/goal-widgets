# Non vérifié : écrit sans Xcode (machine Linux).
# Projet Xcode généré par XcodeGen : `brew install xcodegen && cd ios && xcodegen`
# Le .xcodeproj généré n'est pas versionné ; ce fichier fait foi.
name: GoalWidgets
options:
  bundleIdPrefix: app.goalwidgets
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
packages:
  GoalCore:
    path: GoalCore
targets:
  GoalWidgets:
    type: application
    platform: iOS
    sources:
      - GoalWidgets
    dependencies:
      - package: GoalCore
    # App Group partagé avec l'extension widget (t07) : stockage SwiftData commun.
    entitlements:
      path: GoalWidgets/GoalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.goalwidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.goalwidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Goal Widgets
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
